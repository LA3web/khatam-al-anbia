<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خاتم‌الانبیاء | ورود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--blue:#00c8ff;--blue2:#0077ff;--red:#ff1744;--white:#f4fbff}
html,body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,sans-serif;background:#010207;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
background:radial-gradient(circle at 50% 15%,rgba(0,200,255,.16),transparent 30%),radial-gradient(circle at 85% 85%,rgba(255,23,68,.13),transparent 28%),#010207}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(rgba(0,190,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,190,255,.09) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,#000 15%,#000 85%,transparent)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.65) 100%)}
.card{width:min(91vw,440px);padding:32px 30px 28px;border:1px solid rgba(0,200,255,.92);border-radius:30px;background:linear-gradient(150deg,rgba(8,16,30,.97),rgba(1,4,11,.98));position:relative;z-index:1;box-shadow:0 0 8px rgba(0,200,255,.7),0 0 34px rgba(0,160,255,.25),0 0 70px rgba(255,23,68,.08),inset 0 0 30px rgba(0,200,255,.06);animation:cardIn .75s ease both}
.card:before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,23,68,.22);border-radius:25px;pointer-events:none}
.card:after{content:"";position:absolute;inset:-3px;border-radius:33px;border:1px solid rgba(0,200,255,.25);filter:blur(5px);pointer-events:none}
.logo{width:116px;height:116px;object-fit:contain;display:block;margin:0 auto 16px;filter:invert(1) brightness(1.15) drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 0 16px rgba(0,200,255,.8)) drop-shadow(0 0 28px rgba(0,200,255,.3));position:relative;z-index:2}
.title{font-family:"Noto Nastaliq Urdu",serif;font-size:40px;line-height:1.65;text-align:center;margin:0 0 7px;color:#fff;text-shadow:0 0 5px #fff,0 0 13px var(--blue),0 0 28px rgba(0,183,255,.72);position:relative;z-index:2}
.subtitle{text-align:center;color:#9dc5d6;font-size:12px;letter-spacing:1.5px;margin:0 0 29px;position:relative;z-index:2}
.field{margin:15px 0;position:relative;z-index:2}label{display:block;font-size:13px;color:#dff5ff;margin:0 7px 8px;font-weight:600}.input-wrap{position:relative}
input{width:100%;height:56px;border:1px solid rgba(0,190,255,.62);border-radius:16px;background:rgba(0,8,18,.82);color:#fff;padding:0 17px;font:inherit;outline:none;box-shadow:inset 0 0 15px rgba(0,170,255,.06),0 0 8px rgba(0,170,255,.08);transition:.22s}
input:focus{border-color:var(--blue);box-shadow:0 0 17px rgba(0,200,255,.36),inset 0 0 16px rgba(0,200,255,.08);transform:translateY(-1px)}input::placeholder{color:#607b89}
button{width:100%;height:57px;border:1px solid var(--blue);border-radius:16px;margin-top:21px;background:linear-gradient(100deg,rgba(0,105,180,.38),rgba(0,210,255,.13));color:#fff;font:700 15px Vazirmatn;cursor:pointer;position:relative;z-index:2;box-shadow:0 0 15px rgba(0,190,255,.45),inset 0 0 18px rgba(0,190,255,.1);transition:.2s;overflow:hidden}
button:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-120%);transition:.55s}button:hover:before{transform:translateX(120%)}button:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(0,190,255,.68)}button:active{transform:translateY(0)}
#status{min-height:24px;text-align:center;font-size:12px;color:#8eb7c7;margin-top:16px;position:relative;z-index:2}
.corner{position:absolute;width:15px;height:15px;border-color:var(--red);border-style:solid;z-index:3;filter:drop-shadow(0 0 5px rgba(255,23,68,.7))}.c1{top:14px;right:14px;border-width:2px 2px 0 0}.c2{top:14px;left:14px;border-width:2px 0 0 2px}.c3{bottom:14px;right:14px;border-width:0 2px 2px 0}.c4{bottom:14px;left:14px;border-width:0 0 2px 2px}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97);filter:brightness(.65)}to{opacity:1;transform:none;filter:none}}
@media(max-width:480px){.card{padding:27px 20px 23px;border-radius:26px}.logo{width:100px;height:100px;margin-bottom:15px}.title{font-size:34px}.subtitle{margin-bottom:25px}input{height:54px}button{height:55px}}
@media(max-height:700px){.card{padding-top:20px;padding-bottom:18px}.logo{width:82px;height:82px;margin-bottom:8px}.title{font-size:31px}.subtitle{margin-bottom:17px}.field{margin:10px 0}button{margin-top:14px}}
</style>
</head>

 const p=document.getElementById('sitePassword').value;
 if(!u){msg('نام کاربری را وارد کنید.',true);return;}
 if(p!==SITE_PASSWORD){msg('رمز سایت اشتباه است.',true);return;}
 btn.disabled=true;btn.textContent='در حال ورود...';msg('در حال اتصال به سامانه...');
 try{
   const r=await fetch(SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});
   if(!r.ok) throw new Error('Supabase HTTP '+r.status);
   let {data,error}=await client.auth.signInWithPassword({email:email(u),password:SITE_PASSWORD});
   if(error){
     const su=await client.auth.signUp({email:email(u),password:SITE_PASSWORD,options:{data:{username:u}}});
     if(su.error) throw su.error; data=su.data;
   }
   if(!data?.user) throw new Error('ورود انجام نشد');
   const pr=await client.from('profiles').select('id,username,display_name,verified,is_banned').eq('id',data.user.id).maybeSingle();
   if(pr.error) throw pr.error;
   if(pr.data?.is_banned){await client.auth.signOut();throw new Error('این حساب مسدود شده است.');}
   if(!pr.data){const ins=await client.from('profiles').insert({id:data.user.id,username:u,display_name:u});if(ins.error)throw ins.error;}
   sessionStorage.setItem('khatam_username',u);
   msg('ورود موفق بود.');
   setTimeout(()=>{document.body.innerHTML='<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#010207;color:#fff;font-family:Tahoma,sans-serif;direction:rtl;text-align:center"><section style="padding:35px;border:1px solid #00c8ff;border-radius:28px;box-shadow:0 0 30px #00c8ff"><h2 style="color:#00c8ff">ورود موفق شد</h2><p>خوش آمدید، '+u+'</p><p style="color:#9dc5d6">صفحه اصلی سامانه در مرحله بعدی فعال می‌شود.</p></section></main>'},500);
 }catch(err){console.error(err);msg('خطا: '+(err.message||err),true);}
 finally{btn.disabled=false;btn.textContent='ورود به سامانه';}
});
</script>
</body>
</html>
